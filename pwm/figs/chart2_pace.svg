<text x="16.0" y="358.0" font-size="14" fill="var(--fig-ink-3,#717171)">Blue line: bottom pay (25th percentile, gross) in the</text>
<text x="16.0" y="377.0" font-size="14" fill="var(--fig-ink-3,#717171)">jobs with no ladder until 2022. Grey dashed line: the</text>
<text x="16.0" y="396.0" font-size="14" fill="var(--fig-ink-3,#717171)">median worker's income. Both are shown as the change</text>
<text x="16.0" y="415.0" font-size="14" fill="var(--fig-ink-3,#717171)">from their 2010-12 average, in log points. Shaded: the</text>
<text x="16.0" y="434.0" font-size="14" fill="var(--fig-ink-3,#717171)">start (2010-12) and end (2017-19) windows T3 compares.</text>
<text x="16.0" y="453.0" font-size="14" fill="var(--fig-ink-3,#717171)">A blue line ending below the grey one fell behind; T3</text>
<text x="16.0" y="472.0" font-size="14" fill="var(--fig-ink-3,#717171)">fails if the gap at the end reaches 5 points.</text>
