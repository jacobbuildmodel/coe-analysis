<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 501" role="img" aria-label="Line chart, 2009-2019: bottom pay in jobs without a ladder and the median income, both as the change from their 2010-12 average in log points. Jobs without a ladder kept pace: 4.5 log points short of the median.">
