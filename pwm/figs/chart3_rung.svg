<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 406" role="img" aria-label="Three panels, one per covered group: bottom-quarter basic pay divided by the entry rung, each post-period June, against a dashed line at 0.97. Landscape: in every scored June, the bottom quarter earned at least the entry rung.">
<style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style>
<rect x="0" y="0" width="480" height="406" fill="var(--fig-surface,#fcfcfa)"/>
<text x="16.0" y="28.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Landscape: in every scored June, the bottom</text>
<text x="16.0" y="49.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">quarter earned at least the entry rung</text>
<text x="16.0" y="80.0" font-size="14" fill="var(--fig-ink-3,#717171)">Cleaning and security: not scored (failed T1).</text>
<text x="60.0" y="137.0" font-size="14" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Landscape</text>
<line x1="60" x2="456" y1="249.0" y2="249.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="54.0" y="254.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">0.96</text>
<line x1="60" x2="456" y1="224.0" y2="224.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="54.0" y="229.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">0.98</text>
<line x1="60" x2="456" y1="199.0" y2="199.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="54.0" y="204.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">1</text>
<line x1="60" x2="456" y1="174.0" y2="174.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="54.0" y="179.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">1.02</text>
<line x1="60" x2="456" y1="149.0" y2="149.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="54.0" y="154.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">1.04</text>
<line x1="60" x2="456" y1="236.5" y2="236.5" stroke="var(--fig-ink,#0b0b0b)" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="60" x2="456" y1="199.0" y2="199.0" stroke="var(--fig-context,#707379)" stroke-width="1"/>
<polyline points="144.9,199.0 201.4,199.0 258.0,150.9" fill="none" stroke="var(--fig-subject,#2873ce)" stroke-width="2"/>
<circle cx="144.9" cy="199.0" r="2.5" fill="var(--fig-subject,#2873ce)"/>
<circle cx="201.4" cy="199.0" r="2.5" fill="var(--fig-subject,#2873ce)"/>
<circle cx="258.0" cy="150.9" r="2.5" fill="var(--fig-subject,#2873ce)"/>
<circle cx="427.7" cy="199.0" r="2.5" fill="var(--fig-subject,#2873ce)"/>
<text x="88.3" y="267.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2016</text>
<text x="258.0" y="267.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2019</text>
<text x="427.7" y="267.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">2022</text>
<text x="16.0" y="293.0" font-size="14" fill="var(--fig-ink-3,#717171)">Each panel is one covered group: its bottom-quarter</text>
<text x="16.0" y="312.0" font-size="14" fill="var(--fig-ink-3,#717171)">basic pay (25th percentile) divided by the ladder's</text>
<text x="16.0" y="331.0" font-size="14" fill="var(--fig-ink-3,#717171)">entry rung in force on 1 June, one dot per scored</text>
<text x="16.0" y="350.0" font-size="14" fill="var(--fig-ink-3,#717171)">June. Dashed line: 0.97, the sealed line. A dot below</text>
<text x="16.0" y="369.0" font-size="14" fill="var(--fig-ink-3,#717171)">it fails T5. Solid line: 1.0, pay exactly at the rung.</text>
</svg>
