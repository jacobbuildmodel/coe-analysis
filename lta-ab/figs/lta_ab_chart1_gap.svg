<title id="t">Category B cleared a median $9,010 above A from 2010, and $19,568 over the last five years</title>
<desc id="d">Line chart, one point per COE bidding exercise from January 2010 to October 2026, exercise 1: Category B&#x27;s premium minus Category A&#x27;s. The median gap was $9,010 over the 397 exercises and $19,568 over the last 120. Category A cleared above B in 21 exercises, 3 of them in 2026. Dashed lines mark the steps between adjacent bands in LTA&#x27;s two examples, $7,500 and $15,000.</desc>
