<text x="12" y="52" font-size="17" font-weight="600" fill="var(--fig-ink,#0b0b0b)">apart in October 2026; the five-year</text>
<text x="12" y="71" font-size="17" font-weight="600" fill="var(--fig-ink,#0b0b0b)">median gap was $20,056</text>
<text x="12" y="93" font-size="14" fill="var(--fig-ink-3,#717171)">B minus A, $</text>
