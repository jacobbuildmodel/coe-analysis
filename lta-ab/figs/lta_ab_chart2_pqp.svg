<title id="t">Renewal prices for B and A were $2,901 apart in October 2026; the five-year median gap was $20,056</title>
<desc id="d">Line chart, one point per month from January 2010 to October 2026: the Prevailing Quota Premium for Category B minus that for Category A. The gap was $2,901 in October 2026, a median $4,930 over the last 12 months, $20,056 over the last five years and $8,668 from 2010.</desc>
