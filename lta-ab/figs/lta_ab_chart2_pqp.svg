<text x="12" y="390" font-size="14" fill="var(--fig-ink-3,#717171)">How to read: each point is one month, the PQP that</text>
<text x="12" y="409" font-size="14" fill="var(--fig-ink-3,#717171)">renewing Category B owners paid minus the PQP for</text>
<text x="12" y="428" font-size="14" fill="var(--fig-ink-3,#717171)">Category A. PQP is the average premium over the latest</text>
<text x="12" y="447" font-size="14" fill="var(--fig-ink-3,#717171)">three months with bidding (LTA). Below zero: A&#x27;s PQP was</text>
<text x="12" y="466" font-size="14" fill="var(--fig-ink-3,#717171)">higher. Nominal dollars.</text>
<text x="12" y="485" font-size="14" fill="var(--fig-ink-3,#717171)">Source: SingStat M651121 and LTA M11, January 2010 to</text>
