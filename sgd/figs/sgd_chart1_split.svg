<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 521" role="img" aria-label="Split of the Singapore dollar's rise against the yen and the ringgit">
<style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style>
<rect x="0" y="0" width="480" height="521" fill="var(--fig-surface,#fcfcfa)"/>
<text x="16.0" y="28.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Against the yen, the yen's own fall did most</text>
<text x="16.0" y="49.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">of the work. Against the ringgit, the</text>
<text x="16.0" y="70.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Singapore dollar's own rise did most of the</text>
<text x="16.0" y="91.0" font-size="16" fill="var(--fig-ink,#0b0b0b)" font-weight="600">work.</text>
<line x1="190.0" x2="190.0" y1="126" y2="350" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="190.0" y="368.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">-200</text>
<line x1="278.7" x2="278.7" y1="126" y2="350" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="278.7" y="368.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">0</text>
<line x1="367.3" x2="367.3" y1="126" y2="350" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="367.3" y="368.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">200</text>
<line x1="456.0" x2="456.0" y1="126" y2="350" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/>
<text x="456.0" y="368.0" text-anchor="middle" font-size="14" fill="var(--fig-ink-3,#717171)">400</text>
<text x="16.0" y="142.0" font-size="14" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Against the yen</text>
<text x="182.0" y="165.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">Singapore dollar rose</text>
<rect x="278.7" y="152.0" width="13.6" height="17" fill="var(--fig-subject,#2873ce)"/>
<text x="182.0" y="191.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">yen fell</text>
<rect x="278.7" y="178.0" width="32.5" height="17" fill="var(--fig-context,#707379)"/>
<text x="182.0" y="217.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">neither index</text>
<rect x="276.9" y="204.0" width="1.7" height="17" fill="var(--fig-rule,#e2e1dd)"/>
<text x="16.0" y="254.0" font-size="14" fill="var(--fig-ink,#0b0b0b)" font-weight="600">Against the ringgit</text>
<text x="182.0" y="277.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">Singapore dollar rose</text>
<rect x="278.7" y="264.0" width="112.5" height="17" fill="var(--fig-subject,#2873ce)"/>
<text x="182.0" y="303.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">ringgit fell</text>
<rect x="203.0" y="290.0" width="75.6" height="17" fill="var(--fig-context,#707379)"/>
<text x="182.0" y="329.0" text-anchor="end" font-size="14" fill="var(--fig-ink-3,#717171)">neither index</text>
<rect x="278.7" y="316.0" width="7.4" height="17" fill="var(--fig-rule,#e2e1dd)"/>
<text x="16.0" y="394.0" font-size="14" fill="var(--fig-ink-3,#717171)">How to read: each bar is a share of the Singapore</text>
<text x="16.0" y="413.0" font-size="14" fill="var(--fig-ink-3,#717171)">dollar's rise against that currency, January 2021 to</text>
<text x="16.0" y="432.0" font-size="14" fill="var(--fig-ink-3,#717171)">December 2025, in per cent. Blue: the Singapore dollar</text>
<text x="16.0" y="451.0" font-size="14" fill="var(--fig-ink-3,#717171)">rising against all its trading partners. Grey: that</text>
<text x="16.0" y="470.0" font-size="14" fill="var(--fig-ink-3,#717171)">currency falling against all of its own. Pale:</text>
<text x="16.0" y="489.0" font-size="14" fill="var(--fig-ink-3,#717171)">neither. The three add to 100.</text>
</svg>
